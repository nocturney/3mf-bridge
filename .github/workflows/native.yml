name: Native WebView Windows and macOS

on:
  push:
    branches: [feature/native-webview-shell, feature/native-workflow-ux, feature/slicebridge-brand]
  pull_request:
    paths:
      - 'native/**'
      - 'browser-extension/**'
      - 'engine/**'
      - 'third_party/**'
      - 'scripts/package-prusa-sidecar.py'
      - 'scripts/prusa-sidecar-requirements.txt'
      - 'tests/panda/**'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native:
    name: Windows native WebView2
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout converter and pinned submodule
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: native/go.mod
          cache: false
      - name: Stage bundled extensions from source
        shell: pwsh
        run: |
          node ../browser-extension/build.cjs
          $changed = git -C .. status --porcelain --untracked-files=all -- native/frontend/dist/extension-packages
          if ($LASTEXITCODE -ne 0 -or $changed) { throw 'Embedded extension bytes differ from source; regenerate and commit' }
      - name: Verify offline printer catalogue is reproducible
        shell: pwsh
        run: |
          python ../catalog/tools/check.py ../catalog
          if ($LASTEXITCODE -ne 0) { throw "Catalog metadata verification failed" }
          python ../catalog/tools/verify_ui.py --catalog ../catalog --repo ..
          if ($LASTEXITCODE -ne 0) { throw "Committed printer picker snapshot drift" }
      - name: Test Go engine and native backend
        shell: pwsh
        run: go test -count=1 ./...
      - name: Test native UI and browser handoff
        run: node --test ../browser-extension/build.test.cjs ../browser-extension/setup-flow.test.cjs tests/update-ui.test.js tests/brand-ui.test.js tests/my-printers-ui.test.js tests/manufacturer-slicer-ui.test.js tests/prusa-target-ui.test.js tests/printer-cards-ui.test.js tests/printer-release-dates-ui.test.js tests/supported-targets-ui.test.js tests/main-destinations-ui.test.js
      - name: Verify short-window frontend interactions (headless Chromium/WebView2)
        shell: pwsh
        run: |
          node tests/source-queue-layout-qa.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Source panel is obscured or compact layout regressed' }
      - name: Install stable Wails 2
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build native Windows single exe
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          & "$env:USERPROFILE\go\bin\wails.exe" build -s -ldflags "-X main.buildCommit=$sha"
      - name: Install Python for the Prusa conversion sidecar
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test, build and stage bundled Panda2Prusa engine
        shell: pwsh
        run: |
          python -m unittest discover -s ../tests -p 'test_prusa_single_file.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows one-file packager self-tests failed' }
          python -m pip install --no-cache-dir -r ../scripts/prusa-sidecar-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python engine dependencies failed' }
          python -m unittest discover -s ../third_party/panda2prusa -p 'tests_slicebridge.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Vendored Panda2Prusa regression tests failed' }
          python -m unittest discover -s ../tests/panda -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Cross-format conversion QA failed' }
          python ../scripts/package-prusa-sidecar.py build
          if ($LASTEXITCODE -ne 0) { throw 'Python sidecar build failed' }
          python ../scripts/package-prusa-sidecar.py pack-windows --bin-dir native/build/bin
          if ($LASTEXITCODE -ne 0) { throw 'Embedding Python engine into Windows EXE failed' }
          python ../scripts/package-prusa-sidecar.py verify --platform windows --bin-dir native/build/bin --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Embedded Python engine smoke failed' }
      - name: Verify Windows single-file portable executable
        shell: pwsh
        run: |
          $exe = 'build/bin/SliceBridge.exe'
          if (!(Test-Path $exe)) { throw 'Native binary missing' }
          $size = (Get-Item $exe).Length
          Write-Output "Single-file Windows EXE bytes: $size"
          if ($size -gt 85000000) { throw 'Single-file binary unexpectedly large' }
          foreach ($old in @('build/bin/slicebridge-prusa-engine.exe', 'build/bin/panda2prusa-LICENSE.txt', 'build/bin/SliceBridge-Windows.zip')) {
            if (Test-Path $old) { throw "Unexpected separate Windows release file: $old" }
          }
          # Wails sets the Windows GUI subsystem; PowerShell's direct '& exe'
          # does not reliably assign LASTEXITCODE for GUI apps.
          $probe = Start-Process -FilePath (Resolve-Path $exe).Path -ArgumentList '--verify-bundled-prusa' -Wait -PassThru
          Write-Output "Embedded Prusa probe exit code: $($probe.ExitCode)"
          if ($probe.ExitCode -ne 0) { throw 'Actual Windows app failed embedded Prusa extraction probe' }
          $commit = git rev-parse HEAD
          $buildInfo = go version -m $exe | Out-String
          if ($LASTEXITCODE -ne 0 -or !$buildInfo.Contains($commit)) { throw 'Go executable build commit mismatch' }
      - name: Upload Windows one-file beta
        uses: actions/upload-artifact@v4
        with:
          name: slicebridge-windows-single-exe
          path: native/build/bin/SliceBridge.exe
          if-no-files-found: error
          retention-days: 14

  macos-native:
    name: macOS native WebKit (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout converter and pinned submodule
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: native/go.mod
          cache: false
      - name: Stage bundled extensions from source
        run: |
          node ../browser-extension/build.cjs
          test -z "$(git -C .. status --porcelain --untracked-files=all -- native/frontend/dist/extension-packages)"
      - name: Verify offline printer catalogue is reproducible
        run: |
          python3 ../catalog/tools/check.py ../catalog
          python3 ../catalog/tools/verify_ui.py --catalog ../catalog --repo ..
      - name: Test Go engine and native backend
        run: go test -count=1 ./...
      - name: Test native UI and browser handoff
        run: node --test ../browser-extension/build.test.cjs ../browser-extension/setup-flow.test.cjs tests/update-ui.test.js tests/brand-ui.test.js tests/my-printers-ui.test.js tests/manufacturer-slicer-ui.test.js tests/prusa-target-ui.test.js tests/printer-cards-ui.test.js tests/printer-release-dates-ui.test.js tests/supported-targets-ui.test.js tests/main-destinations-ui.test.js
      - name: Install stable Wails 2
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build macOS app using system WebKit
        run: |
          sha=$(git rev-parse HEAD)
          "$(go env GOPATH)/bin/wails" build -s -ldflags "-X main.buildCommit=$sha"
      - name: Install Python for the Prusa conversion sidecar
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test, build and stage bundled Panda2Prusa engine
        run: |
          python3 -m pip install --no-cache-dir -r ../scripts/prusa-sidecar-requirements.txt
          python3 -m unittest discover -s ../third_party/panda2prusa -p 'tests_slicebridge.py' -v
          python3 -m unittest discover -s ../tests/panda -p 'test_*.py' -v
          python3 ../scripts/package-prusa-sidecar.py build
          python3 ../scripts/package-prusa-sidecar.py stage --platform macos --bin-dir native/build/bin
          python3 ../scripts/package-prusa-sidecar.py verify --platform macos --bin-dir native/build/bin --smoke
      - name: Check native app size and package
        run: |
          APP='build/bin/SliceBridge.app'
          test -d "$APP"
          du -sh "$APP"
          # Verify the packaged macOS app advertises our opt-in URL scheme.
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$APP/Contents/Info.plist")" = slicebridge
          ditto -c -k --sequesterRsrc --keepParent "$APP" build/bin/SliceBridge-macOS-Apple-Silicon.zip
      - name: Upload macOS native beta (ad-hoc signed)
        uses: actions/upload-artifact@v4
        with:
          name: slicebridge-macos-apple-silicon-adhoc
          path: native/build/bin/SliceBridge-macOS-Apple-Silicon.zip
          retention-days: 14
