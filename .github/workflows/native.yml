name: Native WebView Windows and macOS

on:
  push:
    branches: [feature/native-webview-shell, feature/native-workflow-ux, feature/slicebridge-brand]
  pull_request:
    paths:
      - 'native/**'
      - 'browser-extension/**'
      - 'engine/**'
      - 'third_party/**'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native:
    name: Windows native WebView2
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout converter and pinned submodule
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: native/go.mod
          cache: false
      - name: Stage bundled extensions from source
        shell: pwsh
        run: |
          node ../browser-extension/build.cjs
          $changed = git -C .. status --porcelain --untracked-files=all -- native/frontend/dist/extension-packages
          if ($LASTEXITCODE -ne 0 -or $changed) { throw 'Embedded extension bytes differ from source; regenerate and commit' }
      - name: Verify offline printer catalogue is reproducible
        shell: pwsh
        run: |
          python ../catalog/tools/check.py ../catalog
          if ($LASTEXITCODE -ne 0) { throw "Catalog metadata verification failed" }
          python ../catalog/tools/verify_ui.py --catalog ../catalog --repo ..
          if ($LASTEXITCODE -ne 0) { throw "Committed printer picker snapshot drift" }
      - name: Test Go engine and native backend
        shell: pwsh
        run: go test -count=1 ./...
      - name: Test native UI and browser handoff
        run: node --test ../browser-extension/build.test.cjs ../browser-extension/setup-flow.test.cjs tests/update-ui.test.js tests/brand-ui.test.js tests/my-printers-ui.test.js
      - name: Install stable Wails 2
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build native Windows single exe
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          & "$env:USERPROFILE\go\bin\wails.exe" build -s -ldflags "-X main.buildCommit=$sha"
      - name: Verify standalone binary and archive
        shell: pwsh
        run: |
          $exe = 'build/bin/SliceBridge.exe'
          if (!(Test-Path $exe)) { throw 'Native binary missing' }
          $size = (Get-Item $exe).Length
          Write-Output "Native Windows exe bytes: $size"
          if ($size -gt 35000000) { throw 'Native binary unexpectedly large' }
          Compress-Archive -LiteralPath $exe -DestinationPath 'build/bin/SliceBridge-Windows.zip' -CompressionLevel Optimal -Force
      - name: Upload Windows native beta
        uses: actions/upload-artifact@v4
        with:
          name: slicebridge-windows
          path: native/build/bin/SliceBridge-Windows.zip
          retention-days: 14

  macos-native:
    name: macOS native WebKit (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout converter and pinned submodule
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: native/go.mod
          cache: false
      - name: Stage bundled extensions from source
        run: |
          node ../browser-extension/build.cjs
          test -z "$(git -C .. status --porcelain --untracked-files=all -- native/frontend/dist/extension-packages)"
      - name: Verify offline printer catalogue is reproducible
        run: |
          python3 ../catalog/tools/check.py ../catalog
          python3 ../catalog/tools/verify_ui.py --catalog ../catalog --repo ..
      - name: Test Go engine and native backend
        run: go test -count=1 ./...
      - name: Test native UI and browser handoff
        run: node --test ../browser-extension/build.test.cjs ../browser-extension/setup-flow.test.cjs tests/update-ui.test.js tests/brand-ui.test.js tests/my-printers-ui.test.js
      - name: Install stable Wails 2
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build macOS app using system WebKit
        run: |
          sha=$(git rev-parse HEAD)
          "$(go env GOPATH)/bin/wails" build -s -ldflags "-X main.buildCommit=$sha"
      - name: Check native app size and package
        run: |
          APP='build/bin/SliceBridge.app'
          test -d "$APP"
          du -sh "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" build/bin/SliceBridge-macOS-Apple-Silicon.zip
      - name: Upload macOS native beta (ad-hoc signed)
        uses: actions/upload-artifact@v4
        with:
          name: slicebridge-macos-apple-silicon-adhoc
          path: native/build/bin/SliceBridge-macOS-Apple-Silicon.zip
          retention-days: 14
