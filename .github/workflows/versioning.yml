name: Version and changelog contract

on:
  pull_request:
    paths:
      - VERSION
      - CHANGELOG.md
      - VERSIONING.md
      - tools/check_versioning.py
      - tests/test_versioning.py
      - .github/workflows/versioning.yml
  push:
    branches: [main]
    paths:
      - VERSION
      - CHANGELOG.md
      - VERSIONING.md
      - tools/check_versioning.py
      - tests/test_versioning.py
      - .github/workflows/versioning.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify version and milestone entry
        run: |
          python3 tools/check_versioning.py --repo .
          python3 -m unittest discover -s tests -p 'test_versioning.py' -v
