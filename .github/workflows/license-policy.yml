name: License and project metadata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  license-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check SPDX and third-party notices
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          license_text = Path("LICENSE").read_text(encoding="utf-8")
          assert "GNU GENERAL PUBLIC LICENSE" in license_text
          assert "Version 3, 29 June 2007" in license_text
          assert "END OF TERMS AND CONDITIONS" in license_text
          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          lock = json.loads(Path("package-lock.json").read_text(encoding="utf-8"))
          assert package["license"] == "GPL-3.0-only"
          assert lock["packages"][""]["license"] == "GPL-3.0-only"
          required = ["docs/legal/LICENSING.md", "docs/legal/THIRD_PARTY_NOTICES.md", "docs/legal/TRADEMARKS.md", "docs/release/DISTRIBUTION_CHECKLIST.md"]
          for name in required:
              assert Path(name).is_file(), "Missing license document: " + name
          notices = Path("docs/legal/THIRD_PARTY_NOTICES.md").read_text(encoding="utf-8")
          assert "BryanSmee/bl_to_std" in notices
          assert "NOT redistributed" in notices, "Vendor profile redistribution caveat missing"
          checklist = Path("docs/release/DISTRIBUTION_CHECKLIST.md").read_text(encoding="utf-8")
          assert "GPL-3.0-only" in checklist and "matching source" in checklist, "GPL source obligations missing from community guide"
          print("PASS: GPL-3.0-only metadata, third-party notices and community guide")
          PY
