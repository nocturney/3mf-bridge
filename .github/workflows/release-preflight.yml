name: Release preflight (evidence only)

# Does NOT create, sign, publish or upload any GitHub Release.
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/release_preflight.py"
      - "tests/test_release_preflight.py"
      - ".github/workflows/release-preflight.yml"
      - "RELEASE_OPERATIONS.md"
  push:
    branches: [main]
    paths:
      - "tools/release_preflight.py"
      - "tests/test_release_preflight.py"
      - ".github/workflows/release-preflight.yml"
      - "RELEASE_OPERATIONS.md"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact immutable 40-hex source commit SHA (not branch/tag)"
        type: string
        required: true
      draft_tag:
        description: "Optional existing DRAFT release tag for read-only binary checks"
        type: string
        required: false

permissions:
  contents: read

jobs:
  self-test:
    name: Preflight self-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test source archive, SBOM and malicious ZIP handling
        run: python3 -m unittest discover -s tests -p 'test_release_preflight.py' -v
      - name: Smoke source snapshot
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 tools/release_preflight.py \
            --repo . \
            --source-sha "$SOURCE_SHA" \
            --out "$RUNNER_TEMP/slicebridge-smoke-evidence"

  inspect-selected-commit:
    name: Manual evidence package (NEVER publish)
    if: github.event_name == 'workflow_dispatch'
    needs: self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted preflight tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate immutable SHA and optional draft tag
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DRAFT_TAG: ${{ inputs.draft_tag }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r"[0-9a-fA-F]{40}", os.environ["SOURCE_SHA"]), "Require exact commit SHA"
          tag = os.environ.get("DRAFT_TAG", "")
          assert not tag or re.fullmatch(r"[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}", tag), "Invalid draft tag"
          PY
      - name: Checkout exact requested project source (with submodules)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          path: release-source
          submodules: recursive
          persist-credentials: false
      - name: Optional read-only draft asset download
        if: inputs.draft_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ inputs.draft_tag }}
        run: |
          mkdir -p draft-assets
          gh release download "$DRAFT_TAG" --repo "$GITHUB_REPOSITORY" --dir draft-assets
      - name: Generate exact-commit source ZIP, manifest SBOM and checksums
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          args=(--repo release-source --out evidence --source-sha "$SOURCE_SHA")
          if [ -d draft-assets ]; then
            args+=(--assets-dir draft-assets)
          fi
          python3 tools/release_preflight.py "${args[@]}"
          cat evidence/release-evidence.json
      - name: Store source/evidence artifacts ONLY (never draft binaries)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slicebridge-preflight-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
