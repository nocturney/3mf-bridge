name: Release preflight (evidence only)

# Does NOT create, sign, push, publish or upload any GitHub Release.
# Manual runs use the protected main branch's immutable trigger commit only.
# Private/draft Release binaries require a separately authenticated LOCAL audit.
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/release_preflight.py"
      - "tests/test_release_preflight.py"
      - ".github/workflows/release-preflight.yml"
      - "docs/release/RELEASE_OPERATIONS.md"
  push:
    branches: [main]
    paths:
      - "tools/release_preflight.py"
      - "tests/test_release_preflight.py"
      - ".github/workflows/release-preflight.yml"
      - "docs/release/RELEASE_OPERATIONS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    name: Preflight self-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project and tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Test source archive, SBOM and malicious ZIP handling
        run: python3 -m unittest discover -s tests -p 'test_release_preflight.py' -v
      - name: Smoke exact source snapshot
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 tools/release_preflight.py \
            --repo . \
            --source-sha "$SOURCE_SHA" \
            --out "$RUNNER_TEMP/slicebridge-smoke-evidence"

  inspect-protected-main:
    name: Manual main evidence package (NEVER publish)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected main at immutable trigger commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Create source archive, preliminary SBOM and SHA256SUMS
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 tools/release_preflight.py \
            --repo . \
            --out "$RUNNER_TEMP/slicebridge-evidence" \
            --source-sha "$SOURCE_SHA"
          cat "$RUNNER_TEMP/slicebridge-evidence/release-evidence.json"
      - name: Store source/evidence artifact only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slicebridge-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/slicebridge-evidence/
          if-no-files-found: error
          retention-days: 14
