name: Beta compatibility report / דיווח בטא
description: Document results for a future approved beta; do not upload private projects.
title: "[Beta] "
labels: ["beta-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        **Important:** No public beta is currently approved. Use this form only to report a genuinely tested build; do not infer print compatibility from a profile catalogue. Never share sensitive customer 3MF files.
        See the [beta testing guide](https://github.com/nocturney/slicebridge/blob/main/BETA_TESTING.md).
  - type: input
    id: build
    attributes:
      label: Exact build / commit SHA
      placeholder: GitHub commit SHA or private beta build identifier
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows x64
        - macOS Apple Silicon
        - macOS Intel
        - Other
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source slicer and version
      placeholder: Bambu Studio + version
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target slicer, printer and version/model
      placeholder: Slicer version, manufacturer and model
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Physical nozzle and filament
      placeholder: e.g. 0.4mm; PLA, known manufacturer/version
    validations:
      required: true
  - type: checkboxes
    id: tested
    attributes:
      label: Actually tested (not merely inferred)
      description: Check every stage you personally performed. Unchecked means not tested, not failed.
      options:
        - label: Converter generated a destination 3MF
        - label: Target slicer opened destination 3MF
        - label: Target slicer completed Slice and preview was reviewed
        - label: Physical test print completed safely
  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options:
        - Pass for tested stages
        - Fail / unexpected behavior
        - Blocked / missing prerequisites
        - Inconclusive
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: Results, logs and limitations
      description: Specify actual steps and any failures. Remove personal or customer data.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and rights
      options:
        - label: I did not attach private models, credentials, proprietary vendor preset payloads or identifiable customer data.
          required: true
