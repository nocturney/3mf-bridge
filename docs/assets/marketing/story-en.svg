<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">Why I started building SliceBridge</title><desc id="desc">Portrait social artwork. SliceBridge is in development; no public download.</desc>
<defs>
<linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F8FCFA"/><stop offset="1" stop-color="#DFF6EE"/></linearGradient>
<linearGradient id="dark" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#193F38"/><stop offset="1" stop-color="#2F7F73"/></linearGradient>
</defs>
<rect width="1080" height="1350" fill="url(#dark)"/><circle cx="1020" cy="95" r="280" fill="none" stroke="#A9E5D0" stroke-opacity=".16" stroke-width="2"/><circle cx="1020" cy="95" r="390" fill="none" stroke="#A9E5D0" stroke-opacity=".1" stroke-width="2"/><rect x="70" y="70" width="16" height="50" rx="8" fill="#5BBFA8"/><text x="105" y="113" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="43" font-weight="800" fill="#FFFFFF" text-anchor="start" direction="ltr" >SliceBridge</text><rect x="780" y="70" width="216" height="44" rx="22" fill="#E2F8ED"/><text x="888" y="99" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#193F38" text-anchor="middle" direction="ltr" >IN DEVELOPMENT</text><text x="85" y="325" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="78" font-weight="800" fill="#FFFFFF" text-anchor="start" direction="ltr" >Not another slicer.</text><text x="85" y="426" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="77" font-weight="800" fill="#A9E5D0" text-anchor="start" direction="ltr" >A bridge that fits.</text><text x="85" y="522" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="36" font-weight="500" fill="#F5FFFB" text-anchor="start" direction="ltr" >There are plenty of tools out there.</text><text x="85" y="579" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="35" font-weight="500" fill="#F5FFFB" text-anchor="start" direction="ltr" >I built what my workflow was missing.</text><rect x="76" y="661" width="928" height="389" rx="44" fill="#F8FCFA"/><text x="143" y="716" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#2F7F73" text-anchor="start" direction="ltr" letter-spacing="1">THE IDEA</text><rect x="118" y="749" width="258" height="184" rx="28" fill="#EDF7F2" stroke="#CEE6DA" stroke-width="2"/><text x="247" y="817" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#2F7F73" text-anchor="middle" direction="ltr" >SOURCE</text><text x="247" y="874" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#193F38" text-anchor="middle" direction="ltr" >Bambu 3MF</text><rect x="410" y="749" width="258" height="184" rx="28" fill="#DFF6EE" stroke="#CEE6DA" stroke-width="2"/><text x="539" y="817" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#2F7F73" text-anchor="middle" direction="ltr" >BRIDGE</text><text x="539" y="874" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#193F38" text-anchor="middle" direction="ltr" >Local conversion</text><rect x="702" y="749" width="258" height="184" rx="28" fill="#EDF7F2" stroke="#CEE6DA" stroke-width="2"/><text x="831" y="817" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#2F7F73" text-anchor="middle" direction="ltr" >DESTINATION</text><text x="831" y="874" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#193F38" text-anchor="middle" direction="ltr" >Supported slicer</text><text x="540" y="1000" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="23" font-weight="500" fill="#31584D" text-anchor="middle" direction="ltr" >Not a new slicer. A bridge between workflows.</text><text x="85" y="1146" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="41" font-weight="700" fill="#FFFFFF" text-anchor="start" direction="ltr" >Built for my workflow. Shared for yours.</text><line x1="80" x2="1000" y1="1209" y2="1209" stroke="#B7E4D4" stroke-opacity=".45"/><text x="85" y="1265" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#DFF6EE" text-anchor="start" direction="ltr" >OPEN SOURCE PLANNED  •  NO PUBLIC DOWNLOAD YET</text>
</svg>
