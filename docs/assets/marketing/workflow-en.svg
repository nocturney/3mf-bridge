<rect width="1200" height="675" fill="url(#paper)"/><rect x="0" y="0" width="1200" height="12" fill="#2F7F73"/><text x="70" y="78" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="37" font-weight="800" fill="#193F38" text-anchor="start" direction="ltr" >SliceBridge</text><rect x="966" y="44" width="165" height="44" rx="22" fill="#193F38"/><text x="1048.5" y="73" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" direction="ltr" >IN DEVELOPMENT</text><text x="70" y="159" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="57" font-weight="800" fill="#193F38" text-anchor="start" direction="ltr" >One project. More freedom to print.</text><text x="70" y="205" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="28" font-weight="500" fill="#4B6D62" text-anchor="start" direction="ltr" >A clearer path from the source project to your target slicer.</text><rect x="70" y="250" width="340" height="276" rx="30" fill="#FFFFFF" stroke="#CEE6DA" stroke-width="2"/><rect x="98" y="278" width="60" height="46" rx="16" fill="#DFF6EE"/><text x="128" y="309" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="23" font-weight="800" fill="#2F7F73" text-anchor="middle" direction="ltr" >01</text><text x="100" y="377" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="23" font-weight="800" fill="#2F7F73" text-anchor="start" direction="ltr" >SOURCE</text><text x="100" y="431" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#193F38" text-anchor="start" direction="ltr" >Bambu Studio</text><text x="100" y="477" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="24" font-weight="500" fill="#4B6D62" text-anchor="start" direction="ltr" >3MF project</text><rect x="430" y="250" width="340" height="276" rx="30" fill="#FFFFFF" stroke="#CEE6DA" stroke-width="2"/><rect x="458" y="278" width="60" height="46" rx="16" fill="#DFF6EE"/><text x="488" y="309" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="23" font-weight="800" fill="#2F7F73" text-anchor="middle" direction="ltr" >02</text><text x="460" y="377" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="23" font-weight="800" fill="#2F7F73" text-anchor="start" direction="ltr" >SLICEBRIDGE</text><text x="460" y="431" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#193F38" text-anchor="start" direction="ltr" >Convert locally</text><text x="460" y="477" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="24" font-weight="500" fill="#4B6D62" text-anchor="start" direction="ltr" >Compatible profiles</text><rect x="790" y="250" width="340" height="276" rx="30" fill="#FFFFFF" stroke="#CEE6DA" stroke-width="2"/><rect x="818" y="278" width="60" height="46" rx="16" fill="#DFF6EE"/><text x="848" y="309" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="23" font-weight="800" fill="#2F7F73" text-anchor="middle" direction="ltr" >03</text><text x="820" y="377" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="23" font-weight="800" fill="#2F7F73" text-anchor="start" direction="ltr" >TARGET</text><text x="820" y="431" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#193F38" text-anchor="start" direction="ltr" >Continue slicing</text><text x="820" y="477" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="24" font-weight="500" fill="#4B6D62" text-anchor="start" direction="ltr" >Review before print</text><line x1="55" y1="578" x2="1145" y2="578" stroke="#CEE6DA" stroke-width="2"/><text x="70" y="626" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="#31584D" text-anchor="start" direction="ltr" >Supported combinations only  •  Always verify settings before printing  •  No public download</text>
