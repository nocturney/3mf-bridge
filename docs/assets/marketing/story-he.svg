<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">למה התחלתי לבנות את SliceBridge</title><desc id="desc">Portrait social artwork. SliceBridge is in development; no public download.</desc>
<defs>
<linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F8FCFA"/><stop offset="1" stop-color="#DFF6EE"/></linearGradient>
<linearGradient id="dark" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#193F38"/><stop offset="1" stop-color="#2F7F73"/></linearGradient>
</defs>
<rect width="1080" height="1350" fill="url(#dark)"/><circle cx="1020" cy="95" r="280" fill="none" stroke="#A9E5D0" stroke-opacity=".16" stroke-width="2"/><circle cx="1020" cy="95" r="390" fill="none" stroke="#A9E5D0" stroke-opacity=".1" stroke-width="2"/><rect x="70" y="70" width="16" height="50" rx="8" fill="#5BBFA8"/><text x="105" y="113" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="43" font-weight="800" fill="#FFFFFF" text-anchor="start" direction="ltr" >SliceBridge</text><rect x="785" y="70" width="216" height="44" rx="22" fill="#E2F8ED"/><text x="893" y="99" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#193F38" text-anchor="middle" direction="ltr" >פרויקט בפיתוח</text><text x="995" y="325" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="78" font-weight="800" fill="#FFFFFF" text-anchor="end" direction="rtl" >לא עוד סלייסר.</text><text x="995" y="426" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="76" font-weight="800" fill="#A9E5D0" text-anchor="end" direction="rtl" >גשר שמתאים לי.</text><text x="995" y="522" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="36" font-weight="500" fill="#F5FFFB" text-anchor="end" direction="rtl" >יש ברשת המון כלים מצוינים.</text><text x="995" y="579" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="34" font-weight="500" fill="#F5FFFB" text-anchor="end" direction="rtl" >רציתי פתרון שמתאים לצורת העבודה שלי.</text><rect x="76" y="661" width="928" height="389" rx="44" fill="#F8FCFA"/><text x="928" y="716" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#2F7F73" text-anchor="end" direction="rtl" letter-spacing="1">הרעיון</text><rect x="118" y="749" width="258" height="184" rx="28" fill="#EDF7F2" stroke="#CEE6DA" stroke-width="2"/><text x="247" y="817" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#2F7F73" text-anchor="middle" direction="rtl" >יעד</text><text x="247" y="874" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#193F38" text-anchor="middle" direction="rtl" >סלייסר נתמך</text><rect x="410" y="749" width="258" height="184" rx="28" fill="#DFF6EE" stroke="#CEE6DA" stroke-width="2"/><text x="539" y="817" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#2F7F73" text-anchor="middle" direction="rtl" >הגשר</text><text x="539" y="874" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#193F38" text-anchor="middle" direction="rtl" >המרה מקומית</text><rect x="702" y="749" width="258" height="184" rx="28" fill="#EDF7F2" stroke="#CEE6DA" stroke-width="2"/><text x="831" y="817" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#2F7F73" text-anchor="middle" direction="rtl" >מקור</text><text x="831" y="874" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#193F38" text-anchor="middle" direction="rtl" >Bambu 3MF</text><text x="540" y="1000" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="24" font-weight="500" fill="#31584D" text-anchor="middle" direction="rtl" >לא מחליפים את הסלייסר — מחברים בין תהליכי עבודה.</text><text x="995" y="1146" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="end" direction="rtl" >בתקווה שזה יעזור גם לאחרים בקהילה.</text><line x1="80" x2="1000" y1="1209" y2="1209" stroke="#B7E4D4" stroke-opacity=".45"/><text x="990" y="1265" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#DFF6EE" text-anchor="end" direction="rtl" >בדרך לקוד פתוח  •  אין עדיין הורדה ציבורית</text>
