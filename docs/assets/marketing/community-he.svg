<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">קהילה חזקה יותר - SliceBridge</title><desc id="desc">Bilingual community share card for a pre-release development project.</desc>
<defs>
<linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F8FCFA"/><stop offset="1" stop-color="#DFF6EE"/></linearGradient>
<linearGradient id="dark" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#193F38"/><stop offset="1" stop-color="#2F7F73"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#dark)"/><rect x="60" y="52" width="11" height="52" rx="6" fill="#A9E5D0"/><text x="88" y="94" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" text-anchor="start" direction="ltr" >SliceBridge</text><rect x="968" y="59" width="164" height="44" rx="22" fill="#E2F8ED"/><text x="1050" y="88" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#193F38" text-anchor="middle" direction="ltr" >בפיתוח</text><text x="1128" y="259" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="81" font-weight="800" fill="#FFFFFF" text-anchor="start" direction="rtl" >סלייסרים שונים.</text><text x="1128" y="359" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="77" font-weight="800" fill="#A9E5D0" text-anchor="start" direction="rtl" >קהילה חזקה יותר.</text><text x="1128" y="443" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="35" font-weight="500" fill="#E9F8F2" text-anchor="start" direction="rtl" >פתרונות קיימים ועזרת AI, בהתאמה לצורת העבודה שלי.</text><rect x="70" y="506" width="1060" height="84" rx="30" fill="#DFF6EE" fill-opacity=".11" stroke="#A9E5D0" stroke-opacity=".40"/><text x="600" y="559" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle" direction="rtl" >לא סלייסר חדש. גשר בין כלים קיימים.</text><text x="600" y="633" font-family="Arial, 'Noto Sans Hebrew', 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#DFF6EE" text-anchor="middle" direction="rtl" >אין עדיין הורדה ציבורית  •  עקבו אחר הפיתוח ב־GitHub</text>
